name: resume_riverpod_builder
description: A production-grade ATS-optimized resume builder built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ─── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ─── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.2

  # ─── Code Generation / Models ────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ─── Theming ─────────────────────────────────────────────────────────────────
  flex_color_scheme: ^8.0.2

  # ─── PDF Export ──────────────────────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.2

  # ─── UI / UX ─────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  gap: ^3.0.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  image_picker: ^1.1.2
  share_plus: ^10.1.4

  # ─── Utils ───────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  equatable: ^2.0.7
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── App Icon & Splash ────────────────────────────────────────────────────────
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

  # ─── Code Generation ─────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

  # ─── Testing ─────────────────────────────────────────────────────────────────
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

  flutter_lints: ^5.0.0

# Force analyzer_plugin 0.13.x which is compatible with analyzer 7.x.
# riverpod_generator 2.x ships analyzer_plugin ^0.12.0, but 0.12.0 has a
# source-level incompatibility with analyzer 7.6.0 (Element vs Element2 API).
# analyzer_plugin 0.13.0 was released specifically to fix this.
dependency_overrides:
  analyzer_plugin: ">=0.13.0 <0.14.0"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#1565C0"
  image: "assets/icons/app_icon.png"
  android: true
  ios: false
  android_12:
    color: "#1565C0"
    image: "assets/icons/app_icon.png"
